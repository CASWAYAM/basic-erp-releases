<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:Poppins,sans-serif;
 background:radial-gradient(circle at 72% 45%,#e53922 0%,#b3121f 35%,#6e0712 75%,#3d020a 100%);position:relative;color:#fff}
.mandala{position:absolute;right:-260px;top:-140px;width:1350px;height:1350px;opacity:.22}
.border{position:absolute;inset:26px;border:4px solid #f7c948;border-radius:18px}
.border::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(247,201,72,.6);border-radius:12px}
.garland{position:absolute;top:0;left:0;width:100%;height:120px}
.logo{position:absolute;top:110px;left:110px;width:250px;height:250px;border-radius:50%;background:#fff;
 border:8px solid #f7c948;display:flex;align-items:center;justify-content:center;text-align:center;
 color:#b3121f;font-weight:800;font-size:30px;line-height:1.1;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.content{position:absolute;left:110px;top:385px;width:1150px}
.tag{display:inline-block;background:#f7c948;color:#6e0712;font-weight:800;font-size:34px;padding:10px 28px;border-radius:50px;letter-spacing:2px}
h1{font-family:'Yatra One',cursive;font-size:128px;line-height:1;margin-top:18px;color:#ffd84d;
 text-shadow:0 6px 0 #7a0a10,0 12px 30px rgba(0,0,0,.5)}
h2{font-family:Anton,sans-serif;font-size:72px;letter-spacing:2px;margin-top:6px;text-shadow:0 6px 20px rgba(0,0,0,.5)}
h2 span{color:#ffd84d}
.cta{margin-top:14px;font-size:38px;font-weight:700;line-height:1.3}
.cta b{color:#ffd84d}
.items{position:absolute;right:120px;top:330px;width:560px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.item{background:rgba(110,7,18,.55);border:3px solid #f7c948;border-radius:26px;height:200px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;font-size:96px;backdrop-filter:blur(4px)}
.item small{font-size:28px;font-weight:700;margin-top:4px;color:#ffe9a8}
.badge{position:absolute;right:90px;top:140px;width:210px;height:210px;z-index:2;border-radius:50%;background:#ffd84d;color:#8a0b14;
 display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);
 font-family:Anton;font-size:46px;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.4);border:6px dashed #8a0b14;text-align:center}
.badge big{font-size:48px}
.addr{position:absolute;left:0;right:0;bottom:26px;margin:0 26px;height:120px;background:#f7c948;border-radius:0 0 16px 16px;
 display:flex;align-items:center;justify-content:center;gap:24px;color:#5c0610;font-size:40px;font-weight:700}
.addr .pin{font-size:52px}
</style></head><body>
<svg class="mandala" viewBox="-100 -100 200 200" fill="none" stroke="#ffd84d" stroke-width=".6">
 <g id="r"><ellipse rx="10" ry="45" cy="-50"/><ellipse rx="5" ry="25" cy="-50"/></g>
 <script>/* static */</script>
 <circle r="95"/><circle r="88"/><circle r="30"/><circle r="22"/><circle r="12"/>
 <g>
 <use href="#r" transform="rotate(22.5)"/><use href="#r" transform="rotate(45)"/><use href="#r" transform="rotate(67.5)"/>
 <use href="#r" transform="rotate(90)"/><use href="#r" transform="rotate(112.5)"/><use href="#r" transform="rotate(135)"/>
 <use href="#r" transform="rotate(157.5)"/><use href="#r" transform="rotate(180)"/><use href="#r" transform="rotate(202.5)"/>
 <use href="#r" transform="rotate(225)"/><use href="#r" transform="rotate(247.5)"/><use href="#r" transform="rotate(270)"/>
 <use href="#r" transform="rotate(292.5)"/><use href="#r" transform="rotate(315)"/><use href="#r" transform="rotate(337.5)"/>
 </g>
</svg>
<svg class="garland" viewBox="0 0 1920 120" preserveAspectRatio="none">
 <path d="M0 10 Q240 110 480 10 Q720 110 960 10 Q1200 110 1440 10 Q1680 110 1920 10" stroke="#2e7d32" stroke-width="5" fill="none"/>
 <g id="flowers"></g>
</svg>
<div class="border"></div>
<div class="logo" id="logo">YOUR<br>LOGO<br>HERE</div>
<div class="badge">NEW<big>ARRIVALS</big></div>
<div class="content">
 <div class="tag">✦ SHUBHO DURGA PUJA ✦</div>
 <h1>Durga Puja Arrivals</h1>
 <h2>TOYS, GIFTS <span>&amp;</span> MUCH MORE!</h2>
 <div class="cta">Shop all your Durga Puja needs from <b>Modi's 99 Store</b></div>
</div>
<div class="items">
 <div class="item">🧸<small>Toys</small></div>
 <div class="item">🎁<small>Gifts</small></div>
 <div class="item">🪔<small>Puja Items</small></div>
 <div class="item">🏠<small>Home Decor</small></div>
</div>
<div class="addr"><span class="pin">📍</span><span id="address">Modi's 99 Store — [Your Shop Address Here]</span></div>
<script>
// marigold garland
const g=document.getElementById('flowers');
for(let x=0;x<=1920;x+=40){const t=(x%480)/480;const y=10+180*t*(1-t);
 const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
 c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',14);
 c.setAttribute('fill',(x/40)%2?'#ff9800':'#ffc107');c.setAttribute('stroke','#e65100');c.setAttribute('stroke-width',3);g.appendChild(c);}
</script>
</body></html>
