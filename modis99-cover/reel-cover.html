<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#a4c639;--lime-d:#7fa02a;--teal:#1f4c55;--ink:#1b2225;--marigold:#ffb300}
body{width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff;position:relative;
 background:radial-gradient(circle at 50% 30%,#2b6470 0%,#1f4c55 35%,#1a3036 70%,#16191b 100%)}
.mandala{position:absolute;left:50%;top:560px;width:1500px;height:1500px;transform:translate(-50%,-50%);opacity:.16}
.frame{position:absolute;inset:28px;border:4px solid var(--lime);border-radius:28px}
.frame::after{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,255,255,.35);border-radius:20px}
.garland{position:absolute;top:0;left:0;width:100%;height:150px}
.logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:440px;height:440px;border-radius:50%;
 background:#fff;padding:14px;box-shadow:0 0 0 8px var(--lime),0 24px 60px rgba(0,0,0,.55)}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.badge{position:absolute;right:120px;top:170px;width:190px;height:190px;border-radius:50%;background:var(--lime);color:var(--ink);
 display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);
 font-family:Anton;font-size:40px;line-height:1;border:5px dashed var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45);text-align:center;z-index:2}
.badge big{font-size:44px}
.main{position:absolute;top:640px;left:0;right:0;text-align:center}
.tag{display:inline-block;background:var(--lime);color:var(--ink);font-weight:800;font-size:36px;padding:10px 34px;border-radius:60px;letter-spacing:3px}
h1{font-family:'Yatra One',cursive;font-size:150px;line-height:.98;margin-top:26px;color:#fff;text-shadow:0 7px 0 #0f2a30,0 14px 34px rgba(0,0,0,.5)}
h1 span{color:var(--lime)}
h2{font-family:Anton,sans-serif;font-size:74px;letter-spacing:2px;margin-top:18px;text-shadow:0 6px 20px rgba(0,0,0,.5)}
h2 span{color:var(--lime)}
.items{position:absolute;top:1235px;left:110px;right:110px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.item{background:rgba(255,255,255,.08);border:3px solid var(--lime);border-radius:26px;height:200px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;font-size:84px}
.item small{font-size:25px;font-weight:700;margin-top:6px;white-space:nowrap}
.cta{position:absolute;top:1480px;left:80px;right:80px;text-align:center;font-size:44px;font-weight:700;line-height:1.3}
.cta b{color:var(--lime)}
.addr{position:absolute;top:1620px;left:80px;right:80px;background:#fff;color:var(--ink);border-radius:30px;padding:26px 34px;
 display:flex;align-items:center;gap:22px;box-shadow:0 0 0 6px var(--lime),0 18px 40px rgba(0,0,0,.45)}
.addr .pin{width:84px;height:84px;flex:none;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:46px}
.addr .t1{font-weight:800;font-size:40px;color:var(--teal)}
.addr .t2{font-weight:600;font-size:34px}
</style></head><body>
<svg class="mandala" viewBox="-100 -100 200 200" fill="none" stroke="#a4c639" stroke-width=".5">
 <defs><g id="p"><ellipse rx="10" ry="45" cy="-50"/><ellipse rx="5" ry="25" cy="-50"/></g></defs>
 <circle r="96"/><circle r="90"/><g id="ring"></g>
</svg>
<svg class="garland" viewBox="0 0 1080 150"><path d="M0 12 Q270 130 540 12 Q810 130 1080 12" stroke="#2e7d32" stroke-width="5" fill="none"/><g id="fl"></g></svg>
<div class="frame"></div>
<div class="logo"><img src="logo.png" alt="Modi 99 logo"></div>
<div class="badge">NEW<big>ARRIVALS</big></div>
<div class="main">
 <div class="tag">✦ SHUBHO DURGA PUJA ✦</div>
 <h1>Durga Puja<br><span>Arrivals</span></h1>
 <h2>TOYS, GIFTS <span>&amp;</span> MUCH MORE!</h2>
</div>
<div class="items">
 <div class="item">🧸<small>Toys</small></div>
 <div class="item">🎁<small>Gifts</small></div>
 <div class="item">🪔<small>Puja Items</small></div>
 <div class="item">🏠<small>Home Decor</small></div>
</div>
<div class="cta">Shop all your Durga Puja needs<br>from <b>Modi's 99 Store</b></div>
<div class="addr"><div class="pin">📍</div><div><div class="t1">Modi's 99 Store</div><div class="t2">Titabar Chariali, Titabar, Jorhat</div></div></div>
<script>
const NS='http://www.w3.org/2000/svg',ring=document.getElementById('ring');
for(let a=0;a<360;a+=22.5){const u=document.createElementNS(NS,'use');u.setAttribute('href','#p');u.setAttribute('transform','rotate('+a+')');ring.appendChild(u)}
const fl=document.getElementById('fl');
for(let x=0;x<=1080;x+=36){const t=(x%540)/540,y=12+236*t*(1-t);const c=document.createElementNS(NS,'circle');
 c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',13);c.setAttribute('fill',(x/36)%2?'#ff9800':'#ffc107');
 c.setAttribute('stroke','#e65100');c.setAttribute('stroke-width',3);fl.appendChild(c)}
</script>
</body></html>
